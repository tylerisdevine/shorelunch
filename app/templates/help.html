{% extends "base.html" %}

{% block title %}Help / Report Issue - ShoreLunch{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Help / Report an Issue</h1>
</div>

<div class="form-container">
    <p>Found a bug or have a feature request? Fill out the form below and you'll be redirected to GitHub to submit your issue.</p>

    <form id="help-form" class="help-form">
        <div class="form-group">
            <label for="issue_type">Issue Type *</label>
            <select id="issue_type" name="issue_type" required>
                <option value="">Select an issue type...</option>
                <option value="bug">Bug Report</option>
                <option value="feature">Feature Request</option>
                <option value="question">Question</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required
                   placeholder="Brief description of the issue">
        </div>

        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" rows="8" required
                      placeholder="Please provide as much detail as possible:
- What were you trying to do?
- What happened instead?
- Steps to reproduce the issue"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Issue on GitHub</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('help-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const issueType = document.getElementById('issue_type').value;
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;

    const typeLabels = {
        'bug': '[Bug]',
        'feature': '[Feature Request]',
        'question': '[Question]',
        'other': ''
    };

    const fullTitle = typeLabels[issueType] ? `${typeLabels[issueType]} ${title}` : title;

    const body = `## Description
${description}

---
*Submitted via ShoreLunch Help Form*`;

    const githubUrl = `https://github.com/tylerisdevine/shorelunch/issues/new?title=${encodeURIComponent(fullTitle)}&body=${encodeURIComponent(body)}`;

    window.open(githubUrl, '_blank');
});
</script>
{% endblock %}
